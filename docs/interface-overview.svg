      <text x="43" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#5e6c82">主控电脑</text>
      <line x1="70" y1="92" x2="70" y2="113" stroke="#bdc9d9" stroke-width="4"/>
      <line x1="45" y1="113" x2="95" y2="113" stroke="#bdc9d9" stroke-width="4" stroke-linecap="round"/>
      <circle cx="126" cy="18" r="4" fill="#28b486"/>

      <circle cx="166" cy="70" r="22" fill="#1f63d7"/><text x="157" y="77" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#fff">→</text>

      <rect x="192" y="24" width="140" height="88" rx="11" fill="#eff6ff" stroke="#b9cdf0"/>
      <text x="235" y="72" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#5e6c82">被控电脑</text>
      <line x1="262" y1="112" x2="262" y2="133" stroke="#bdc9d9" stroke-width="4"/>
      <line x1="237" y1="133" x2="287" y2="133" stroke="#bdc9d9" stroke-width="4" stroke-linecap="round"/>
      <circle cx="318" cy="38" r="4" fill="#28b486"/>
