name: Build ShifanAI Host Share Native

on:
  push:
    branches: [v1-native-quic, v1-wan-key, v1-wan-reliability, v1-alpha6-input-polish, v1-alpha7-real-input-fix, v1-alpha8-realtime-input-worker, v1-alpha9-real-device-fixes, v1-alpha10-input-core-rework, main]
    paths:
      - "native_v1/**"
      - ".github/workflows/build-v1-native.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shifan-host-share-native-${{ github.ref_name }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: XxMinor/mykvm
  UPSTREAM_SHA: a2ea4164861de31b562c8417eeb7879dbc8c23cb
  PRODUCT_LOGO_URL: https://i.ibb.co/nMzmgBR7/AI.png

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < native_v1/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create or refresh prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="视饭AI:主机共享 Native Alpha 10。重做 Windows 实时输入核心：鼠标移动改为独立 latest snapshot，彻底移除 alpha.9 ActiveTarget try_lock 丢唤醒造成的跳帧；键盘、点击和滚轮改走 QUIC 有序可靠输入 stream，不再与可丢弃鼠标 datagram 共用不可靠状态通道；Windows 键盘增加低级 Hook + 物理按键状态备用捕获；软件界面新增实时输入诊断，直接显示捕获、入队、发送、接收、鉴权、SendInput 注入、鼠标快照竞争和网络路径/丢包数据。"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "视饭AI:主机共享 $TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "视饭AI:主机共享 $TAG" --notes "$notes" --prerelease
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare product icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          New-Item -ItemType Directory -Force assets | Out-Null
          curl.exe -fL --retry 3 --connect-timeout 10 "$env:PRODUCT_LOGO_URL" -o assets/icon-source.png
          if ($LASTEXITCODE -ne 0 -or !(Test-Path assets/icon-source.png)) {
            Remove-Item assets/icon-source.png -ErrorAction SilentlyContinue
            python native_v1/materialize_icon_fallback.py assets/icon-source.png
          }
          python native_v1/prepare_icon.py assets/icon-source.png assets/AI.png
          if (!(Test-Path assets/AI.png)) { throw "Product icon was not generated" }
      - name: Prepare pinned native source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}.git" native-upstream
          git -C native-upstream checkout "$UPSTREAM_SHA"
          python native_v1/rebrand_upstream.py native-upstream --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          python native_v1/apply_wan_overlay.py native-upstream
          python native_v1/apply_input_quality_overlay.py native-upstream
          python native_v1/apply_wan_reliability_overlay.py native-upstream
          python native_v1/apply_alpha6_overlay.py native-upstream
          python native_v1/apply_alpha6_transport_fairness.py native-upstream
          python native_v1/apply_alpha7_real_input_fix.py native-upstream
          python native_v1/apply_alpha8_realtime_input_worker.py native-upstream
          python native_v1/apply_alpha9_real_device_fixes.py native-upstream
          python native_v1/apply_alpha10_input_core_rework_runner.py native-upstream
          mkdir -p native-upstream/public
          cp assets/AI.png native-upstream/public/app-icon.png
          cp native_v1/THIRD_PARTY_NOTICES.md native-upstream/THIRD_PARTY_NOTICES-SHIFANAI.md
      - name: Install dependencies and generate native icons
        working-directory: native-upstream
        shell: pwsh
        run: |
          npm ci
          npm exec -- tauri icon "$env:GITHUB_WORKSPACE/assets/AI.png"
      - name: Verify frontend
        working-directory: native-upstream
        shell: pwsh
        run: npm run build
      - name: Verify Rust source
        working-directory: native-upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $lines = cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | ForEach-Object { $_.ToString() }
          $exit = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) {
            $tail = ($lines | Select-Object -Last 35) -join " | "
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows Rust compile failure::$tail"
            exit $exit
          }
      - name: Build Windows installer
        working-directory: native-upstream
        shell: pwsh
        run: npm exec -- tauri build --bundles nsis
      - name: Collect and upload Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $installer = Get-ChildItem "native-upstream/src-tauri/target/release/bundle/nsis" -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $out = "out/ShifanAI-HostShare-Windows-x64-Setup.exe"
          Copy-Item $installer.FullName $out
          Get-FileHash $out -Algorithm SHA256 | Format-List
          gh release upload $env:TAG $out --clobber --repo "$env:GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: ShifanAI-HostShare-Windows-x64
          path: out/ShifanAI-HostShare-Windows-x64-Setup.exe

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: ShifanAI-HostShare-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: ShifanAI-HostShare-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare product icon
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          mkdir -p assets
          if ! curl -fL --retry 3 --connect-timeout 10 "$PRODUCT_LOGO_URL" -o assets/icon-source.png; then
            rm -f assets/icon-source.png
            python native_v1/materialize_icon_fallback.py assets/icon-source.png
          fi
          python native_v1/prepare_icon.py assets/icon-source.png assets/AI.png
          test -f assets/AI.png
      - name: Prepare pinned native source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}.git" native-upstream
          git -C native-upstream checkout "$UPSTREAM_SHA"
          python native_v1/rebrand_upstream.py native-upstream --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          python native_v1/apply_wan_overlay.py native-upstream
          python native_v1/apply_input_quality_overlay.py native-upstream
          python native_v1/apply_wan_reliability_overlay.py native-upstream
          python native_v1/apply_alpha6_overlay.py native-upstream
          python native_v1/apply_alpha6_transport_fairness.py native-upstream
          python native_v1/apply_alpha7_real_input_fix.py native-upstream
          python native_v1/apply_alpha8_realtime_input_worker.py native-upstream
          python native_v1/apply_alpha9_real_device_fixes.py native-upstream
          python native_v1/apply_alpha10_input_core_rework_runner.py native-upstream
          mkdir -p native-upstream/public
          cp assets/AI.png native-upstream/public/app-icon.png
          cp native_v1/THIRD_PARTY_NOTICES.md native-upstream/THIRD_PARTY_NOTICES-SHIFANAI.md
      - name: Install dependencies and generate native icons
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm exec -- tauri icon "$GITHUB_WORKSPACE/assets/AI.png"
      - name: Verify source
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"
      - name: Build macOS DMG
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- tauri build --target "${{ matrix.target }}" --bundles app,dmg --no-sign
      - name: Collect and upload macOS package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          dmg="$(find "native-upstream/src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "out/$ASSET"
          shasum -a 256 "out/$ASSET"
          gh release upload "$TAG" "out/$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
