<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视饭AI:主机共享</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell"><header class="topbar"><div class="brand"><img src="AI.png" class="logo" alt="视饭AI"><div><div class="brand-title">视饭AI<span>:</span>主机共享</div><div class="brand-sub">一套鼠标键盘 · 无缝跨越 Windows 与 macOS</div></div></div><div class="top-status" id="topStatus"><i></i><span>本机已就绪</span></div></header>
<main class="workspace"><section class="hero-card local-card"><div class="section-head"><div><div class="eyebrow">THIS COMPUTER</div><h2>本机连接信息</h2></div><div class="version" id="version">v0.2.0</div></div><div class="device-line"><div class="device-icon">⌘</div><div class="device-meta"><strong id="deviceName">正在读取…</strong><span id="osText">本机</span></div><div class="ready-pill"><b></b>可被连接</div></div><div class="info-grid"><div class="info-box"><span>推荐局域网 IP</span><div class="copyline"><strong id="localIp">--</strong><button data-copy="localIp">复制</button></div></div><div class="info-box accent"><span>本机安全配对码</span><div class="copyline"><strong id="pairCode">----</strong><button data-copy="pairCode">复制</button></div></div></div><div class="lan-hint" id="lanHint">正在识别网卡…</div><div class="local-actions"><button class="ghost" id="regenBtn">↻ 重新生成配对码</button><button class="ghost mac-only" id="permissionBtn">系统输入权限</button></div></section>
<section class="hero-card connect-card"><div class="section-head"><div><div class="eyebrow">CONNECT</div><h2>连接第二台电脑</h2></div><div class="secure">◆ 本地安全配对</div></div><label>第二台电脑 IP</label><div class="input-wrap"><span>⌁</span><input id="peerIp" autocomplete="off" spellcheck="false" placeholder="例如 192.168.1.6"></div><label>第二台电脑配对码</label><div class="input-wrap"><span>⌨</span><input id="peerCode" autocomplete="off" spellcheck="false" placeholder="例如 ABCD-EFGH-2345"></div><div class="position-title"><label>第二台屏幕实际位置</label><small>按你桌面真实摆放选择</small></div><div class="direction-grid" id="directions"><button data-dir="left"><b>←</b><span>左侧</span></button><button data-dir="right" class="active"><b>→</b><span>右侧</span></button><button data-dir="up"><b>↑</b><span>上方</span></button><button data-dir="down"><b>↓</b><span>下方</span></button></div><button class="primary" id="connectBtn"><span>启动主机共享</span><b>→</b></button><button class="stop hidden" id="stopBtn">停止共享</button></section></main>
<footer class="status-card" id="statusCard"><div class="pulse"><i></i></div><div class="status-copy"><strong id="statusText">准备就绪 · 等待连接</strong><span id="statusDetail">两台电脑打开同一版本软件，输入第二台电脑的 IP 和配对码即可</span></div><div class="engine" id="engineText">Deskflow Core · 检查中</div></footer></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
