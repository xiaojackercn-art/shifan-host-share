<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">视饭AI:主机共享 界面预览</title>
  <desc id="desc">主控电脑连接与设备管理界面预览</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6de2"/>
      <stop offset="1" stop-color="#0a3c92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e314d" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="68" rx="28" fill="#ffffff"/>
  <rect y="40" width="1400" height="28" fill="#ffffff"/>
  <line x1="0" y1="68" x2="1400" y2="68" stroke="#e4eaf2"/>

  <g transform="translate(24 15)">
    <rect width="38" height="38" rx="10" fill="url(#brand)"/>
    <rect x="7" y="9" width="18" height="13" rx="2.5" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="18" y="17" width="15" height="11" rx="2.2" fill="none" stroke="#cde4ff" stroke-width="2"/>
    <path d="M10 27h8m-4-5v5M22 32h7m-3.5-4v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 14h9m-3-3 4 3-4 3" stroke="#62e0c5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="74" y="31" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#172033">视饭AI:主机共享</text>
  <text x="74" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#8792a5">跨设备键鼠控制</text>

  <g transform="translate(620 24)">
    <circle cx="0" cy="10" r="4" fill="#1eaf7d"/>
    <circle cx="0" cy="10" r="8" fill="#1eaf7d" opacity=".11"/>
    <text x="14" y="14" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6d7990">连接服务正常</text>
  </g>

  <g transform="translate(1245 17)" font-family="Segoe UI, sans-serif" font-size="17" fill="#68758a">
    <text x="0" y="25">—</text><text x="48" y="25">□</text><text x="96" y="25">×</text>
  </g>

  <g transform="translate(88 102)">
    <rect width="1224" height="242" rx="22" fill="#fff" stroke="#e0e7f0" filter="url(#shadow)"/>
    <text x="38" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#2463d4">SHIFAN HOST SHARE</text>
    <text x="38" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="39" font-weight="760" fill="#152033">一套键鼠，自然切换多台电脑</text>
    <text x="38" y="132" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#6c788e">不同网络也可以建立连接，无需公网 IP、端口映射或同一 Wi‑Fi。</text>
    <text x="38" y="157" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#6c788e">鼠标推过屏幕边缘即可切换，键盘自动跟随当前电脑。</text>

    <g transform="translate(38 187)" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#526079">
      <rect width="116" height="30" rx="15" fill="#f8fafe" stroke="#dfe6f0"/><text x="15" y="20">公网直连 / 中继</text>
      <rect x="126" width="112" height="30" rx="15" fill="#f8fafe" stroke="#dfe6f0"/><text x="143" y="20">低延迟鼠标</text>
      <rect x="248" width="90" height="30" rx="15" fill="#f8fafe" stroke="#dfe6f0"/><text x="268" y="20">键盘跟随</text>
      <rect x="348" width="110" height="30" rx="15" fill="#f8fafe" stroke="#dfe6f0"/><text x="367" y="20">加密连接密钥</text>
    </g>

