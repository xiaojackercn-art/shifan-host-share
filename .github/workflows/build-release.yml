name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shifan-host-share-release
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: echo "tag=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; build files will be replaced."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "视饭AI:主机共享 $TAG" --notes "Windows + macOS 首个可测试版本。请先阅读 README 中的系统权限与使用说明。"
          fi

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Prepare application icon
        run: python scripts/prepare_icon.py
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "ShifanAI-HostShare" `
            --icon "assets/AI.ico" `
            --paths "src" `
            --collect-all pynput `
            --collect-all cryptography `
            launcher.py
          Copy-Item "dist/ShifanAI-HostShare.exe" "ShifanAI-HostShare-Windows-x64.exe"
          Compress-Archive -Path "dist/ShifanAI-HostShare.exe" -DestinationPath "ShifanAI-HostShare-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ShifanAI-HostShare-Windows-x64
          path: |
            ShifanAI-HostShare-Windows-x64.exe
            ShifanAI-HostShare-Windows-x64.zip
      - name: Upload files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: gh release upload "$env:TAG" "ShifanAI-HostShare-Windows-x64.exe" "ShifanAI-HostShare-Windows-x64.zip" --clobber

  build-macos-arm:
    needs: prepare-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Prepare application icon
        run: python scripts/prepare_icon.py
      - name: Build macOS Apple Silicon app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name "视饭AI主机共享" \
            --icon "assets/AI.icns" \
            --osx-bundle-identifier "com.csshifan.shifanhostshare" \
            --paths "src" \
            --collect-all pynput \
            --collect-all cryptography \
            launcher.py
          codesign --force --deep --sign - "dist/视饭AI主机共享.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/视饭AI主机共享.app" "ShifanAI-HostShare-macOS-AppleSilicon.zip"
          hdiutil create -volname "视饭AI主机共享" -srcfolder "dist/视饭AI主机共享.app" -ov -format UDZO "ShifanAI-HostShare-macOS-AppleSilicon.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ShifanAI-HostShare-macOS-AppleSilicon
          path: |
            ShifanAI-HostShare-macOS-AppleSilicon.dmg
            ShifanAI-HostShare-macOS-AppleSilicon.zip
      - name: Upload files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$TAG" "ShifanAI-HostShare-macOS-AppleSilicon.dmg" "ShifanAI-HostShare-macOS-AppleSilicon.zip" --clobber

  build-macos-intel:
    needs: prepare-release
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Prepare application icon
        run: python scripts/prepare_icon.py
      - name: Build macOS Intel app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name "视饭AI主机共享" \
            --icon "assets/AI.icns" \
            --osx-bundle-identifier "com.csshifan.shifanhostshare" \
            --paths "src" \
            --collect-all pynput \
            --collect-all cryptography \
            launcher.py
          codesign --force --deep --sign - "dist/视饭AI主机共享.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/视饭AI主机共享.app" "ShifanAI-HostShare-macOS-Intel.zip"
          hdiutil create -volname "视饭AI主机共享" -srcfolder "dist/视饭AI主机共享.app" -ov -format UDZO "ShifanAI-HostShare-macOS-Intel.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ShifanAI-HostShare-macOS-Intel
          path: |
            ShifanAI-HostShare-macOS-Intel.dmg
            ShifanAI-HostShare-macOS-Intel.zip
      - name: Upload files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$TAG" "ShifanAI-HostShare-macOS-Intel.dmg" "ShifanAI-HostShare-macOS-Intel.zip" --clobber
