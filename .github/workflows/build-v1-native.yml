name: Build Native QUIC v1 Alpha

on:
  push:
    branches: [v1-native-quic]
    paths:
      - "native_v1/**"
      - "scripts/prepare_icon.py"
      - ".github/workflows/build-v1-native.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shifan-host-share-native-v1
  cancel-in-progress: true

env:
  UPSTREAM_REPO: XxMinor/mykvm
  UPSTREAM_SHA: a2ea4164861de31b562c8417eeb7879dbc8c23cb

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < native_v1/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create or refresh prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="v1 Native Alpha：彻底切换到 Rust/Tauri + UDP 局域网发现 + QUIC/TLS 1.3 原生软件 KVM。删除 Python/Deskflow/TCP 24800 链路。包含 Windows/macOS 原生键鼠、边缘跨屏、键盘跟随、剪贴板、XXXX-XXXX-XXXX 配对挑战。此版本用于两台实体电脑核心验收，未通过实机验收前不标记 stable。"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "视饭AI:主机共享 $TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "视饭AI:主机共享 $TAG" --notes "$notes" --prerelease
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare product icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_icon.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path assets/AI.png)) {
            New-Item -ItemType Directory -Force assets | Out-Null
            python native_v1/materialize_icon_fallback.py assets/icon-source.png
            python native_v1/prepare_icon.py assets/icon-source.png assets/AI.png
          }
          if (!(Test-Path assets/AI.png)) { throw "Product icon was not generated" }
      - name: Prepare pinned native source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}.git" native-upstream
          git -C native-upstream checkout "$UPSTREAM_SHA"
          python native_v1/rebrand_upstream.py native-upstream --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          cp native_v1/THIRD_PARTY_NOTICES.md native-upstream/THIRD_PARTY_NOTICES-SHIFANAI.md
      - name: Install dependencies and generate icons
        working-directory: native-upstream
        shell: pwsh
        run: |
          npm ci
          npm exec -- tauri icon "$env:GITHUB_WORKSPACE/assets/AI.png"
      - name: Verify source
        working-directory: native-upstream
        shell: pwsh
        run: |
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        working-directory: native-upstream
        shell: pwsh
        run: npm exec -- tauri build --bundles nsis
      - name: Collect and upload Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $installer = Get-ChildItem "native-upstream/src-tauri/target/release/bundle/nsis" -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $out = "out/ShifanAI-HostShare-v1-Windows-x64-Setup.exe"
          Copy-Item $installer.FullName $out
          Get-FileHash $out -Algorithm SHA256 | Format-List
          gh release upload $env:TAG $out --clobber --repo $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@v4
        with:
          name: ShifanAI-HostShare-v1-Windows-x64
          path: out/ShifanAI-HostShare-v1-Windows-x64-Setup.exe

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: ShifanAI-HostShare-v1-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: ShifanAI-HostShare-v1-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare product icon
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          if ! python scripts/prepare_icon.py || [ ! -f assets/AI.png ]; then
            mkdir -p assets
            python native_v1/materialize_icon_fallback.py assets/icon-source.png
            python native_v1/prepare_icon.py assets/icon-source.png assets/AI.png
          fi
          test -f assets/AI.png
      - name: Prepare pinned native source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}.git" native-upstream
          git -C native-upstream checkout "$UPSTREAM_SHA"
          python native_v1/rebrand_upstream.py native-upstream --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          cp native_v1/THIRD_PARTY_NOTICES.md native-upstream/THIRD_PARTY_NOTICES-SHIFANAI.md
      - name: Install dependencies and generate icons
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm exec -- tauri icon "$GITHUB_WORKSPACE/assets/AI.png"
      - name: Verify source
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"
      - name: Build macOS DMG
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- tauri build --target "${{ matrix.target }}" --bundles app,dmg --no-sign
      - name: Collect and upload macOS package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          dmg="$(find "native-upstream/src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "out/$ASSET"
          shasum -a 256 "out/$ASSET"
          gh release upload "$TAG" "out/$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
