name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shifan-host-share-release
  cancel-in-progress: true

env:
  DESKFLOW_VERSION: "1.26.0"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          NOTES="v0.9.0：针对两台 Windows 实机测试继续修复。第一，v0.8 的本机 TCP 探测会让 Deskflow 输出 accepted client connection，旧代码误把它当成真正第二台电脑连接；v0.9 只有 Deskflow 完成屏幕名/协议握手并输出 client \"NAME\" has connected 后才显示‘已连接’。第二，Windows 防火墙规则不再使用 remoteip=LocalSubnet，改为仅限制 TCP 24800 端口、但覆盖任意网络配置和 profile；安装版自动写入，便携版缺失时运行时可请求 UAC 自动修复。第三，连接探测和 Deskflow 握手全部可取消，点击‘取消连接/停止共享’会立即重置按钮并使旧后台线程失效，不再出现停止后仍显示‘正在连接主控电脑’。第四，客户端只有 TCP 可达并完成真实 Deskflow 握手后才算连接成功。发布前执行单元测试、UI 取消回归测试、真实 Deskflow listener/转发测试、安装器和新版 IN/OUT 防火墙规则验证。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "视饭AI:主机共享 $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "视饭AI:主机共享 $TAG" --notes "$NOTES"
          fi

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt pytest
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          $env:PYTHONPATH="src"
          $env:QT_QPA_PLATFORM="offscreen"
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          python scripts/prepare_icon.py
          if ($LASTEXITCODE -ne 0) { throw "Icon preparation failed" }
      - name: Download Deskflow
        shell: pwsh
        run: |
          $url="https://github.com/deskflow/deskflow/releases/download/v$env:DESKFLOW_VERSION/deskflow-$env:DESKFLOW_VERSION-win-x64-portable.7z"
          curl.exe -L --fail --retry 5 -o deskflow.7z $url
          if ($LASTEXITCODE -ne 0) { throw "Deskflow download failed" }
          New-Item -ItemType Directory -Force vendor-download | Out-Null
          7z x deskflow.7z -ovendor-download -y
          if ($LASTEXITCODE -ne 0) { throw "Deskflow extraction failed" }
          python scripts/normalize_deskflow_windows.py vendor-download vendor/Deskflow
          if ($LASTEXITCODE -ne 0) { throw "Deskflow normalization failed" }
      - name: Build app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name "ShifanAI-HostShare" `
            --icon "assets/AI.ico" `
            --paths "src" `
            --add-data "assets;assets" `
            launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          New-Item -ItemType Directory -Force "dist/ShifanAI-HostShare/engine" | Out-Null
          Copy-Item "vendor/Deskflow" "dist/ShifanAI-HostShare/engine/Deskflow" -Recurse
          & "dist/ShifanAI-HostShare/engine/Deskflow/deskflow-core.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Deskflow core failed version check" }
      - name: Real Deskflow server socket test
        shell: pwsh
        run: |
          python scripts/smoke_deskflow_server.py "dist/ShifanAI-HostShare/engine/Deskflow/deskflow-core.exe"
          if ($LASTEXITCODE -ne 0) { throw "Deskflow real listener smoke test failed" }
      - name: Real Deskflow transport through ShifanAI bridge
        shell: pwsh
        run: |
          python scripts/smoke_deskflow_pair.py "dist/ShifanAI-HostShare/engine/Deskflow/deskflow-core.exe"
          if ($LASTEXITCODE -ne 0) { throw "ShifanAI bridge to real Deskflow listener test failed" }
      - name: Smoke test portable UI
        shell: pwsh
        run: |
          $exe=Resolve-Path "dist/ShifanAI-HostShare/ShifanAI-HostShare.exe"
          $p=Start-Process $exe -PassThru
          Start-Sleep 6
          if ($p.HasExited) { throw "Portable app exited early" }
          Stop-Process -Id $p.Id -Force
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc="C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "installer/windows.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Compress-Archive -Path "dist/ShifanAI-HostShare/*" -DestinationPath "release/ShifanAI-HostShare-Portable-Windows-x64.zip" -Force
      - name: Smoke test installer, firewall and installed app
        shell: pwsh
        run: |
          $installer=Resolve-Path "release/ShifanAI-HostShare-Setup-x64.exe"
          $target=Join-Path $env:RUNNER_TEMP "ShifanAIHostShareSmoke"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $p=Start-Process $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed" }
          $app=Join-Path $target "ShifanAI-HostShare.exe"
          $core=Join-Path $target "engine\Deskflow\deskflow-core.exe"
          if (!(Test-Path $app) -or !(Test-Path $core)) { throw "Installed files missing" }

          $inRule = Get-NetFirewallRule -DisplayName "ShifanAI-HostShare-TCP-24800-IN" -ErrorAction Stop
          if (("$($inRule.Enabled)") -ne "True" -or ("$($inRule.Direction)") -ne "Inbound" -or ("$($inRule.Action)") -ne "Allow") { throw "v0.9 inbound firewall rule invalid" }
          $inPort = $inRule | Get-NetFirewallPortFilter
          if (("$($inPort.Protocol)") -ne "TCP" -or ("$($inPort.LocalPort)") -notmatch "24800") { throw "v0.9 inbound TCP 24800 rule missing" }
          $inAddress = $inRule | Get-NetFirewallAddressFilter
          if (("$($inAddress.RemoteAddress)") -match "LocalSubnet") { throw "v0.9 inbound rule is still LocalSubnet-scoped" }

          $outRule = Get-NetFirewallRule -DisplayName "ShifanAI-HostShare-TCP-24800-OUT" -ErrorAction Stop
          if (("$($outRule.Enabled)") -ne "True" -or ("$($outRule.Direction)") -ne "Outbound" -or ("$($outRule.Action)") -ne "Allow") { throw "v0.9 outbound firewall rule invalid" }
          $outPort = $outRule | Get-NetFirewallPortFilter
          if (("$($outPort.Protocol)") -ne "TCP" -or ("$($outPort.RemotePort)") -notmatch "24800") { throw "v0.9 outbound TCP 24800 rule missing" }

          python scripts/smoke_deskflow_server.py "$core"
          if ($LASTEXITCODE -ne 0) { throw "Installed Deskflow real listener test failed" }
          python scripts/smoke_deskflow_pair.py "$core"
          if ($LASTEXITCODE -ne 0) { throw "Installed ShifanAI bridge to real Deskflow listener test failed" }

          $run=Start-Process $app -PassThru
          Start-Sleep 5
          if ($run.HasExited) { throw "Installed app exited early" }
          Stop-Process -Id $run.Id -Force
          Write-Host "Windows installer, v0.9 firewall rules, real Deskflow listener, ShifanAI bridge transport and installed app validation passed"
      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: gh release upload "$env:TAG" release/* --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ShifanAI-HostShare-Windows-x64-${{ needs.prepare-release.outputs.tag }}
          path: release/*
