    <text x="28" y="36" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#2463d4">设备</text>
    <text x="28" y="68" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">已连接电脑</text>
    <rect x="1108" y="27" width="72" height="28" rx="14" fill="#f1f4f8"/>
    <text x="1131" y="46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#6a768a">1 台</text>

    <rect x="28" y="87" width="1166" height="78" rx="14" fill="#fcfdff" stroke="#dfe6ef"/>
    <rect x="46" y="104" width="44" height="44" rx="12" fill="#eef4ff"/>
    <rect x="56" y="113" width="24" height="17" rx="3" fill="none" stroke="#2563d6" stroke-width="2"/>
    <line x1="68" y1="130" x2="68" y2="138" stroke="#2563d6" stroke-width="2"/>
    <line x1="61" y1="138" x2="75" y2="138" stroke="#2563d6" stroke-width="2" stroke-linecap="round"/>
    <text x="106" y="121" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#263149">Office-PC-02</text>
    <rect x="205" y="105" width="64" height="23" rx="11" fill="#eaf8f3"/>
    <circle cx="218" cy="116.5" r="3" fill="#22ad7e"/>
    <text x="227" y="120" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#19825f">可控制</text>
    <text x="106" y="143" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#8792a4">Windows · 1 个屏幕 · 加密连接</text>

    <text x="626" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#3d4960">屏幕位置</text>
    <g transform="translate(720 101)" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5b687e">
      <rect width="84" height="34" rx="8" fill="#fff" stroke="#d5deea"/><text x="20" y="22">← 左侧</text>
      <rect x="92" width="84" height="34" rx="8" fill="#f7fbff" stroke="#9cb7de"/><text x="111" y="22" fill="#245eb8">右侧 →</text>
      <rect x="184" width="84" height="34" rx="8" fill="#fff" stroke="#d5deea"/><text x="205" y="22">↑ 上方</text>
      <rect x="276" width="84" height="34" rx="8" fill="#fff" stroke="#d5deea"/><text x="297" y="22">↓ 下方</text>
    </g>
  </g>

  <text x="88" y="791" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#8c97a9">界面预览 · Native Alpha</text>
