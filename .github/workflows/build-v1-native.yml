name: Build ShifanAI Host Share Native

on:
  push:
    branches: [main, v1-native-quic, release/alpha3-input-ui]
    paths:
      - "native_v1/**"
      - "docs/**"
      - ".github/workflows/build-v1-native.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shifan-host-share-native-${{ github.ref_name }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: XxMinor/mykvm
  UPSTREAM_SHA: a2ea4164861de31b562c8417eeb7879dbc8c23cb

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < native_v1/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: 创建或更新预发布版本
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="视饭AI：主机共享 ${TAG}。本版本重点优化 Windows 双机键鼠体验：降低远端鼠标处理开销、提高鼠标发送节奏、拆分键盘与高频鼠标状态锁、增强扫描码键盘注入，并修复 Windows 输入服务内部标识被品牌替换的问题。Windows 安装程序固定使用简体中文界面，同时更新桌面 UI、使用说明和真机验收规范。"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "视饭AI：主机共享 $TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "视饭AI：主机共享 $TAG" --notes "$notes" --prerelease
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 准备产品图标
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python native_v1/materialize_icon_fallback.py assets/icon-source.png
          python native_v1/prepare_icon.py assets/icon-source.png assets/AI.png
          if (!(Test-Path assets/AI.png)) { throw "产品图标生成失败" }

      - name: 准备固定版本原生源码
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}.git" native-upstream
          git -C native-upstream checkout "$UPSTREAM_SHA"
          python native_v1/rebrand_upstream.py native-upstream --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          python native_v1/harden_native.py native-upstream
          mkdir -p native-upstream/public
          cp assets/icon-source.png native-upstream/public/app-icon.png
          cp native_v1/THIRD_PARTY_NOTICES.md native-upstream/THIRD_PARTY_NOTICES-SHIFANAI.md

      - name: 安装依赖并生成原生图标
        working-directory: native-upstream
        shell: pwsh
        run: |
          npm ci
          npm exec -- tauri icon "$env:GITHUB_WORKSPACE/assets/AI.png"

      - name: 编译检查
        working-directory: native-upstream
        shell: pwsh
        run: |
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: 生成 Windows 中文安装包
        working-directory: native-upstream
        shell: pwsh
        run: npm exec -- tauri build --bundles nsis

      - name: 收集 Windows 安装包并准备构建产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $installer = Get-ChildItem "native-upstream/src-tauri/target/release/bundle/nsis" -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          $out = "out/ShifanAI-HostShare-Windows-x64-Setup.exe"
          Copy-Item $installer.FullName $out
          Get-FileHash $out -Algorithm SHA256 | Format-List

      - name: 上传 Windows 安装包到预发布
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: pwsh
        run: gh release upload $env:TAG out/ShifanAI-HostShare-Windows-x64-Setup.exe --clobber --repo $env:GITHUB_REPOSITORY

      - uses: actions/upload-artifact@v4
        with:
          name: ShifanAI-HostShare-Windows-x64
          path: out/ShifanAI-HostShare-Windows-x64-Setup.exe

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: ShifanAI-HostShare-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: ShifanAI-HostShare-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 准备产品图标
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python native_v1/materialize_icon_fallback.py assets/icon-source.png
          python native_v1/prepare_icon.py assets/icon-source.png assets/AI.png
          test -f assets/AI.png

      - name: 准备固定版本原生源码
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${UPSTREAM_REPO}.git" native-upstream
          git -C native-upstream checkout "$UPSTREAM_SHA"
          python native_v1/rebrand_upstream.py native-upstream --version "$VERSION" --repo "$GITHUB_REPOSITORY"
          python native_v1/harden_native.py native-upstream
          mkdir -p native-upstream/public
          cp assets/icon-source.png native-upstream/public/app-icon.png
          cp native_v1/THIRD_PARTY_NOTICES.md native-upstream/THIRD_PARTY_NOTICES-SHIFANAI.md

      - name: 安装依赖并生成原生图标
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm exec -- tauri icon "$GITHUB_WORKSPACE/assets/AI.png"

      - name: 编译检查
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"

      - name: 生成 macOS 安装包
        working-directory: native-upstream
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- tauri build --target "${{ matrix.target }}" --bundles app,dmg --no-sign

      - name: 收集 macOS 安装包
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          dmg="$(find "native-upstream/src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "out/$ASSET"
          shasum -a 256 "out/$ASSET"

      - name: 上传 macOS 安装包到预发布
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: gh release upload "$TAG" "out/$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
