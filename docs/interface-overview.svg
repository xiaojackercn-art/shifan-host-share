  <g transform="translate(88 366)">
    <rect width="1224" height="178" rx="20" fill="#fff" stroke="#e0e7f0" filter="url(#shadow)"/>
    <text x="28" y="37" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#2463d4">主控电脑</text>
    <text x="28" y="70" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">连接另一台电脑</text>
    <text x="28" y="94" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#7e899d">粘贴被控电脑生成的连接密钥，无需填写 IP、端口或路由器配置。</text>
    <rect x="28" y="112" width="934" height="46" rx="10" fill="#fbfcfe" stroke="#d8e0eb"/>
    <text x="45" y="140" font-family="Cascadia Mono, monospace" font-size="11" fill="#9aa5b6">SFAI1-eyJ2ZXJzaW9uIjoxLCJlbmRwb2ludElkIjoiLi4u</text>
    <rect x="976" y="112" width="218" height="46" rx="10" fill="#2669d3"/>
    <text x="1039" y="141" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fff">建立连接</text>
  </g>

  <g transform="translate(88 566)">
